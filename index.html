<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kicks Hub - Shoes 300 to 1000</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <nav class="bg-gray-900 text-white p-4 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wider">KICKS HUB</h1>
            <p class="text-sm text-gray-300">Premium shoes. Strictly ₹300 - ₹1000.</p>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto mt-8 p-4 grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <div class="col-span-1 bg-white p-6 rounded-lg shadow-md border border-gray-200 h-fit">
            <h2 class="text-xl font-bold mb-4 border-b pb-2">Seller Panel: Add Shoe</h2>
            <form id="addShoeForm" class="space-y-4">
                
                <div>
                    <label class="block text-sm font-semibold mb-1">Shoe Name</label>
                    <input type="text" id="shoeName" required class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" placeholder="e.g. Classic Sneakers">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Image URL (Upload)</label>
                    <input type="url" id="shoeImage" required class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" placeholder="https://link-to-your-image.jpg">
                    <p class="text-xs text-gray-500 mt-1">In a real app, this would be a file upload button.</p>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Price (₹300 - ₹1000)</label>
                    <input type="number" id="shoePrice" min="300" max="1000" required class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" placeholder="500">
                </div>

                <div class="flex items-center">
                    <input type="checkbox" id="isNegotiable" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                    <label for="isNegotiable" class="ml-2 text-sm font-semibold text-gray-700">Price is Negotiable</label>
                </div>

                <button type="submit" class="w-full bg-gray-900 text-white font-bold py-2 rounded hover:bg-gray-800 transition">
                    List Shoe for Sale
                </button>
            </form>
        </div>

        <div class="col-span-1 md:col-span-2">
            <h2 class="text-xl font-bold mb-4 border-b pb-2">Storefront</h2>
            <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                </div>
        </div>

    </main>

    <script>
        // Sample Initial Data
        const products = [
            {
                name: "Urban Runners",
                image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=60",
                price: 850,
                negotiable: true
            },
            {
                name: "Casual Canvas",
                image: "https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=60",
                price: 450,
                negotiable: false
            }
        ];

        const productGrid = document.getElementById('productGrid');
        const addShoeForm = document.getElementById('addShoeForm');

        // Function to render products to the screen
        function renderProducts() {
            productGrid.innerHTML = ''; // Clear current grid
            
            products.forEach((product, index) => {
                const negotiableBadge = product.negotiable 
                    ? `<span class="bg-green-100 text-green-800 text-xs font-semibold px-2.5 py-0.5 rounded ml-2 border border-green-400">Negotiable</span>` 
                    : '';
                
                const negotiateBtn = product.negotiable
                    ? `<button onclick="negotiatePrice('${product.name}', ${product.price})" class="mt-2 w-full bg-white text-gray-900 border border-gray-900 font-bold py-2 rounded hover:bg-gray-100 transition">Make an Offer</button>`
                    : '';

                const cardHTML = `
                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden flex flex-col">
                        <img src="${product.image}" alt="${product.name}" class="w-full h-48 object-cover">
                        <div class="p-4 flex-grow flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-lg text-gray-900">${product.name}</h3>
                                <div class="mt-2 flex items-center">
                                    <span class="text-xl font-extrabold text-blue-600">₹${product.price}</span>
                                    ${negotiableBadge}
                                </div>
                            </div>
                            <div class="mt-4">
                                <button onclick="buyNow('${product.name}', ${product.price})" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700 transition">
                                    Buy Now
                                </button>
                                ${negotiateBtn}
                            </div>
                        </div>
                    </div>
                `;
                productGrid.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        // Handle Add Shoe Form Submission
        addShoeForm.addEventListener('submit', function(e) {
            e.preventDefault(); // Prevent page reload
            
            const price = parseInt(document.getElementById('shoePrice').value);
            
            // Extra safeguard for price (HTML already handles min/max, but good practice)
            if(price < 300 || price > 1000) {
                alert("Price must be between 300 and 1000!");
                return;
            }

            const newProduct = {
                name: document.getElementById('shoeName').value,
                image: document.getElementById('shoeImage').value,
                price: price,
                negotiable: document.getElementById('isNegotiable').checked
            };

            products.push(newProduct); // Add to our array
            renderProducts(); // Update the UI
            addShoeForm.reset(); // Clear the form
        });

        // Mock functions for Buy and Negotiate
        function buyNow(name, price) {
            alert(`Redirecting to payment gateway to buy ${name} for ₹${price}...\n\n(Integration with Stripe, Razorpay, or PayPal goes here!)`);
        }

        function negotiatePrice(name, currentPrice) {
            const offer = prompt(`The current price for ${name} is ₹${currentPrice}. Enter your offer (Must be at least 300):`);
            if (offer) {
                if(parseInt(offer) < 300) {
                    alert("Sorry, we do not accept offers below ₹300.");
                } else {
                    alert(`Your offer of ₹${offer} for the ${name} has been sent to the seller for approval!`);
                }
            }
        }

        // Initial render
        renderProducts();
    </script>
</body>
</html>
