<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kicks Hub | Premium Footwear</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .modal-active { overflow: hidden; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <nav class="bg-slate-900 text-white p-5 shadow-xl sticky top-0 z-40">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-3xl font-extrabold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">
                KICKS HUB
            </h1>
            <a href="mailto:uikeykhushank60@gmail.com" class="text-sm bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-full font-semibold transition">
                Support
            </a>
        </div>
    </nav>

    <div class="bg-white py-12 shadow-sm mb-10">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <h2 class="text-4xl font-bold text-slate-800 mb-4">Step Up Your Style</h2>
            <p class="text-gray-500 max-w-2xl mx-auto text-lg">Premium Shoes, Sandals, and Slippers at prices that make sense. Fast and secure UPI payments only.</p>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 mb-20">
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-10">
            </div>
    </main>

    <footer class="bg-slate-900 text-gray-400 py-8 text-center border-t border-slate-800">
        <p>&copy; 2026 Kicks Hub. All rights reserved.</p>
        <p class="mt-2 text-sm">Need help? Email us at <a href="mailto:uikeykhushank60@gmail.com" class="text-indigo-400 hover:text-indigo-300">uikeykhushank60@gmail.com</a></p>
    </footer>

    <div id="upiModal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-sm w-full mx-4 transform scale-95 transition-transform duration-300" id="modalContent">
            <div class="text-center">
                <div class="bg-indigo-100 text-indigo-600 rounded-full h-16 w-16 flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                </div>
                <h3 class="text-2xl font-bold text-gray-900 mb-2">Pay via UPI</h3>
                <p class="text-gray-500 text-sm mb-6" id="modalProductName">Product Name</p>
                
                <div class="bg-gray-50 rounded-lg p-4 mb-6 border border-gray-200">
                    <p class="text-sm text-gray-500 mb-1">Total Amount</p>
                    <p class="text-3xl font-extrabold text-slate-800" id="modalPrice">₹0</p>
                </div>

                <div class="space-y-3">
                    <button onclick="processUPI()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg flex items-center justify-center">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/e/e1/UPI-Logo-vector.svg" alt="UPI" class="h-5 mr-2 filter brightness-0 invert">
                        Open UPI App
                    </button>
                    <button onclick="closeModal()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 px-4 rounded-xl transition">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Product Database
        const products = [
            {
                name: "Nike Urban Runners",
                category: "Shoes",
                image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80",
                price: 899
            },
            {
                name: "Classic White Sneakers",
                category: "Shoes",
                image: "https://images.unsplash.com/photo-1515955656352-a1fa3ffcd111?auto=format&fit=crop&w=600&q=80",
                price: 699
            },
            {
                name: "Premium Leather Floaters",
                category: "Sandals",
                image: "https://images.unsplash.com/photo-1603487742131-4160ec999306?auto=format&fit=crop&w=600&q=80",
                price: 549
            },
            {
                name: "Casual Strap Sandals",
                category: "Sandals",
                image: "https://images.unsplash.com/photo-1543163521-1bf539c55dd2?auto=format&fit=crop&w=600&q=80",
                price: 450
            },
            {
                name: "Comfort Black Slides",
                category: "Chappal",
                image: "https://images.unsplash.com/photo-1562183241-b937e95585b6?auto=format&fit=crop&w=600&q=80",
                price: 299
            },
            {
                name: "Summer Flip Flops",
                category: "Chappal",
                image: "https://images.unsplash.com/photo-1603487742131-4160ec999306?auto=format&fit=crop&w=600&q=80", // Using a solid alternative image
                price: 199
            }
        ];

        const productGrid = document.getElementById('productGrid');
        const upiModal = document.getElementById('upiModal');
        const modalContent = document.getElementById('modalContent');

        // Render Products
        function renderProducts() {
            products.forEach((product) => {
                const cardHTML = `
                    <div class="bg-white rounded-2xl shadow-md hover:shadow-2xl transition-all duration-300 overflow-hidden group border border-gray-100 flex flex-col">
                        <div class="relative overflow-hidden">
                            <img src="${product.image}" alt="${product.name}" class="w-full h-64 object-cover transform group-hover:scale-105 transition-transform duration-500">
                            <span class="absolute top-4 right-4 bg-white/90 backdrop-blur-sm text-slate-800 text-xs font-bold px-3 py-1 rounded-full shadow-sm uppercase tracking-wider">
                                ${product.category}
                            </span>
                        </div>
                        <div class="p-6 flex-grow flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-xl text-gray-900 mb-1">${product.name}</h3>
                                <p class="text-3xl font-extrabold text-indigo-600 mt-3">₹${product.price}</p>
                            </div>
                            <button onclick="openModal('${product.name}', ${product.price})" class="mt-6 w-full bg-slate-900 text-white font-bold py-3 rounded-xl hover:bg-indigo-600 transition-colors duration-300 shadow-md">
                                Buy Now
                            </button>
                        </div>
                    </div>
                `;
                productGrid.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        // Modal Logic
        function openModal(name, price) {
            document.getElementById('modalProductName').innerText = name;
            document.getElementById('modalPrice').innerText = `₹${price}`;
            
            upiModal.classList.remove('hidden');
            document.body.classList.add('modal-active');
            
            // Small delay for animation
            setTimeout(() => {
                upiModal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            upiModal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                upiModal.classList.add('hidden');
                document.body.classList.remove('modal-active');
            }, 300);
        }

        function processUPI() {
            // Frontend simulation for UPI
            alert("This is a frontend prototype. In a real app, this button will open PhonePe, GPay, or Paytm directly using a UPI Deep Link (upi://pay?pa=yourvpa@upi...).");
            closeModal();
        }

        renderProducts();
    </script>
</body>
</html>
