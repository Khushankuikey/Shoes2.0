    <div id="orderModal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full mx-4 transform scale-95 transition-transform duration-300" id="modalContent">
            <div class="text-center mb-4">
                <h3 class="text-2xl font-bold text-gray-900">Complete Your Order</h3>
                <p class="text-gray-500 text-sm" id="modalProductName">Product Name - ₹0</p>
            </div>
            
            <form id="checkoutForm" class="space-y-4 text-left">
                <div>
                    <label class="block text-sm font-semibold text-gray-700">Full Name</label>
                    <input type="text" id="custName" required class="w-full mt-1 border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="Rahul Kumar">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700">Delivery Address & Pincode</label>
                    <textarea id="custAddress" required rows="3" class="w-full mt-1 border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="House no, Street, City, Pincode"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700">Phone Number</label>
                    <input type="tel" id="custPhone" required class="w-full mt-1 border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="+91 XXXXX XXXXX">
                </div>

                <div class="pt-4 space-y-3">
                    <button type="button" onclick="placeOrderViaWhatsApp()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg flex items-center justify-center">
                        <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                        Place Order via WhatsApp
                    </button>
                    <button type="button" onclick="closeModal()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 px-4 rounded-xl transition">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Copy tumhari purani products list yahan!
        const products = [
            { name: "Nike Urban Runners", category: "Shoes", image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&q=80", price: 899 },
            { name: "Classic White Sneakers", category: "Shoes", image: "https://images.unsplash.com/photo-1515955656352-a1fa3ffcd111?w=600&q=80", price: 699 }
            // Naye items aage badha lena...
        ];

        const productGrid = document.getElementById('productGrid');
        const orderModal = document.getElementById('orderModal');
        const modalContent = document.getElementById('modalContent');
        
        // Save selected product details temporarily
        let selectedProduct = "";
        let selectedPrice = 0;

        function renderProducts() {
            productGrid.innerHTML = ''; // Clear purana
            products.forEach((product) => {
                const cardHTML = `
                    <div class="bg-white rounded-2xl shadow-md hover:shadow-2xl transition-all duration-300 overflow-hidden group border border-gray-100 flex flex-col">
                        <div class="relative overflow-hidden">
                            <img src="${product.image}" alt="${product.name}" class="w-full h-64 object-cover transform group-hover:scale-105 transition-transform duration-500">
                            <span class="absolute top-4 right-4 bg-white/90 text-slate-800 text-xs font-bold px-3 py-1 rounded-full shadow-sm uppercase">${product.category}</span>
                        </div>
                        <div class="p-6 flex-grow flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-xl text-gray-900 mb-1">${product.name}</h3>
                                <p class="text-3xl font-extrabold text-indigo-600 mt-3">₹${product.price}</p>
                            </div>
                            <button onclick="openModal('${product.name}', ${product.price})" class="mt-6 w-full bg-slate-900 text-white font-bold py-3 rounded-xl hover:bg-indigo-600 transition-colors shadow-md">
                                Buy Now
                            </button>
                        </div>
                    </div>
                `;
                productGrid.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        function openModal(name, price) {
            selectedProduct = name;
            selectedPrice = price;
            
            document.getElementById('modalProductName').innerText = `${name} - ₹${price}`;
            
            orderModal.classList.remove('hidden');
            document.body.classList.add('overflow-hidden');
            
            setTimeout(() => {
                orderModal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            orderModal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                orderModal.classList.add('hidden');
                document.body.classList.remove('overflow-hidden');
                document.getElementById('checkoutForm').reset();
            }, 300);
        }

        function placeOrderViaWhatsApp() {
            const name = document.getElementById('custName').value;
            const address = document.getElementById('custAddress').value;
            const phone = document.getElementById('custPhone').value;

            if(!name || !address || !phone) {
                alert("Please fill all details before placing the order!");
                return;
            }

            // APNA NUMBER YAHAN DAALO (Country code 91 ke sath, bina + lagaye)
            const myWhatsAppNumber = "916260155319"; 
            
            const message = `*NEW ORDER FROM KICKS HUB* 🚀\n\n*Product:* ${selectedProduct}\n*Price:* ₹${selectedPrice}\n\n*Customer Details:*\nName: ${name}\nPhone: ${phone}\nAddress: ${address}\n\n_Please confirm my order and share UPI details for payment._`;

            const whatsappURL = `https://wa.me/${myWhatsAppNumber}?text=${encodeURIComponent(message)}`;
            
            // Open WhatsApp
            window.open(whatsappURL, '_blank');
            closeModal();
        }

        renderProducts();
    </script>
</body>
</html>
