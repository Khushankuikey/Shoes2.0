<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KICKS4U | The Ultimate Footwear Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }
        .modal-active { overflow: hidden; }
        html { scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 4px; }
    </style>
</head>
<body class="text-slate-800">

    <!-- Navbar -->
    <nav class="bg-slate-900 text-white p-4 shadow-2xl sticky top-0 z-40">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">
                KICKS4U
            </h1>
            <div class="flex-grow md:max-w-md mx-4">
                <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Search shoes, sandals..." class="w-full px-4 py-2 rounded-full text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <a href="mailto:uikeykhushank60@gmail.com" class="text-xs md:text-sm bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-full font-bold transition shadow-lg border border-blue-400">
                Support
            </a>
        </div>
    </nav>

    <!-- Filters Section -->
    <div class="bg-white shadow-sm sticky top-[72px] z-30 border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 py-3 flex overflow-x-auto gap-3 hide-scrollbar">
            <button onclick="setCategory('All')" class="filter-btn bg-slate-900 text-white px-4 py-1.5 rounded-full text-sm font-bold whitespace-nowrap transition">All Footwear</button>
            <button onclick="setCategory('Premium')" class="filter-btn bg-gray-100 hover:bg-gray-200 text-slate-700 px-4 py-1.5 rounded-full text-sm font-bold whitespace-nowrap transition">Premium (₹1000+)</button>
            <button onclick="setCategory('Casual')" class="filter-btn bg-gray-100 hover:bg-gray-200 text-slate-700 px-4 py-1.5 rounded-full text-sm font-bold whitespace-nowrap transition">Casual Sneakers</button>
            <button onclick="setCategory('Slippers')" class="filter-btn bg-gray-100 hover:bg-gray-200 text-slate-700 px-4 py-1.5 rounded-full text-sm font-bold whitespace-nowrap transition">Sandals & Slippers</button>
        </div>
    </div>

    <!-- Storefront Grid -->
    <main class="max-w-7xl mx-auto px-4 py-8 mb-20">
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Products injected by JS -->
        </div>
        <div id="noResult" class="hidden text-center py-20 text-gray-500 font-bold text-xl">
            No products found matching your search.
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-gray-400 py-8 text-center border-t border-slate-800">
        <p>&copy; 2026 KICKS4U. All rights reserved.</p>
        <p class="mt-2 text-sm">Need help? Email us at <a href="mailto:uikeykhushank60@gmail.com" class="text-blue-400 hover:text-blue-300">uikeykhushank60@gmail.com</a></p>
    </footer>

    <!-- ORDER & UPI PAYMENT MODAL -->
    <div id="orderModal" class="fixed inset-0 bg-slate-900 bg-opacity-80 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300 overflow-y-auto backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl p-6 md:p-8 max-w-md w-full mx-4 my-8 transform scale-95 transition-transform duration-300 relative" id="modalContent">
            
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-gray-100 text-gray-600 hover:bg-red-100 hover:text-red-600 h-8 w-8 rounded-full font-bold text-xl flex items-center justify-center transition">&times;</button>
            
            <div class="text-center mb-4 mt-2">
                <h3 class="text-2xl font-black text-gray-900">Secure Payment</h3>
                <div class="bg-slate-50 p-2 rounded-xl mt-2 border border-slate-200 shadow-inner">
                    <p class="text-slate-700 font-bold text-sm" id="modalProductName">Product Name</p>
                    <p class="text-blue-600 font-black text-2xl mt-1" id="modalPrice">₹0</p>
                </div>
            </div>
            
            <form id="checkoutForm" class="space-y-3 text-left">
                
                <!-- UPI PAYMENT SECTION -->
                <div class="bg-indigo-50 border border-indigo-200 p-4 rounded-xl text-center">
                    <p class="text-xs font-bold text-indigo-800 uppercase tracking-wide mb-2">1. Scan & Pay</p>
                    <img src="https://upload.wikimedia.org/wikipedia/commons/e/e1/UPI-Logo-vector.svg" class="h-10 mx-auto mb-2 opacity-80" alt="UPI">
                    <div class="bg-white p-2 rounded border border-indigo-100 inline-block mb-2">
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=6260155319@upi&pn=KICKS4U&am=0" alt="UPI QR" class="h-32 w-32 mx-auto">
                    </div>
                    <p class="text-[10px] text-gray-500 font-semibold">Scan with GPay, PhonePe, or Paytm</p>
                    
                    <div class="mt-3">
                        <label class="block text-xs font-bold text-indigo-700 text-left uppercase tracking-wide">2. Enter UTR / Transaction ID *</label>
                        <input type="text" id="custUtr" required class="w-full mt-1 border border-indigo-300 p-2 rounded focus:ring-2 focus:ring-indigo-500 outline-none font-bold text-slate-800" placeholder="e.g. 302198347129">
                    </div>
                </div>

                <!-- ADDRESS SECTION -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide">Full Name</label>
                    <input type="text" id="custName" required class="w-full mt-1 border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none font-medium text-slate-800" placeholder="Rahul Kumar">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide">WhatsApp Number</label>
                    <input type="tel" id="custPhone" required class="w-full mt-1 border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none font-medium text-slate-800" placeholder="10-digit number">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide">Delivery Address</label>
                        <button type="button" onclick="autoLocate()" id="locBtn" class="text-[10px] bg-indigo-100 text-indigo-700 px-2 py-1 rounded-md hover:bg-indigo-200 font-bold flex items-center transition shadow-sm">
                            📍 Auto-Detect
                        </button>
                    </div>
                    <textarea id="custAddress" required rows="2" class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none font-medium text-slate-800" placeholder="House no, Street, City..."></textarea>
                    <p id="locStatus" class="text-xs text-gray-500 mt-1 hidden font-semibold">Fetching location...</p>
                </div>

                <div class="pt-2">
                    <button type="button" onclick="placeOrderViaWhatsApp()" class="w-full bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white font-black py-3 px-4 rounded-xl transition shadow-xl flex items-center justify-center text-md tracking-wide border border-green-600">
                        Verify Payment & Confirm Order
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Generating 60 unique items securely via JS
        const basePremium = [
            { name: "Executive High-Top Kicks", img: "https://images.unsplash.com/photo-1515955656352-a1fa3ffcd111?w=600&q=80", desc: "Advanced cushioning technology. Breathable upper with carbon-fiber plate for maximum style." },
            { name: "Alpha Leather Oxfords", img: "https://images.unsplash.com/photo-1549298916-b41d501d3772?w=600&q=80", desc: "100% Genuine Full-grain leather. Water-resistant and durable. Perfect for elite parties." },
            { name: "Titan Chelsea Boots", img: "https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=600&q=80", desc: "Retro streetwear style. Padded collar for extreme ankle comfort. Made with premium materials." },
            { name: "Majestic Formals", img: "https://images.unsplash.com/photo-1584990347449-a6e14a27ea80?w=600&q=80", desc: "Handcrafted with a glossy finish. Features a pointed toe design and anti-slip sole." },
            { name: "Elite Suede Loafers", img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&q=80", desc: "Slip into luxury with these ultra-soft suede loafers. Anti-slip rubber sole for perfect grip." },
            { name: "Royal Derby Shoes", img: "https://images.unsplash.com/photo-1614252232525-a111f6262939?w=600&q=80", desc: "Classic derby silhouette with a modern touch. Memory foam insole for all-day office comfort." }
        ];

        const baseCasual = [
            { name: "Dynamic Athletics", img: "https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?w=600&q=80", desc: "Thick grip lugs for extreme traction. Reinforced toe cap protects against impact." },
            { name: "Urban Trail Shoes", img: "https://images.unsplash.com/photo-1551107696-a4b0c5a0d9a2?w=600&q=80", desc: "The ultimate wardrobe essential. Minimalist design that pairs perfectly with jeans and shorts." },
            { name: "Classic Running Shoes", img: "https://images.unsplash.com/photo-1560769629-975ec94e6a86?w=600&q=80", desc: "Flexible sole perfect for daily use. Odor-resistant inner lining ensures your feet stay fresh." },
            { name: "Neo Skater Kicks", img: "https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=600&q=80", desc: "No laces, no hassle. Ultra-lightweight and breathable. Perfect for college or evening walks." }
        ];

        const baseSlippers = [
            { name: "Cloud Winter Slippers", img: "https://images.unsplash.com/photo-1596700877995-1f9e23927233?w=600&q=80", desc: "Feels like walking on clouds. Super soft, lightweight, and perfect for wearing around the house." },
            { name: "Zen Foam Slides", img: "https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=600&q=80", desc: "Tough straps that don't tear. Water-friendly design makes it perfect for beach vacations." },
            { name: "Cozy Leather Sandals", img: "https://images.unsplash.com/photo-1603487742131-4160ec999306?w=600&q=80", desc: "Doctor-recommended arch support and memory foam footbed. Reduces knee and heel pain." },
            { name: "Daily Rubber Chappal", img: "https://images.unsplash.com/photo-1562183241-b937e95585b6?w=600&q=80", desc: "High-density rubber ensures it doesn't thin out quickly. The most affordable, daily wear." },
            { name: "Breeze Cross Sandals", img: "https://images.unsplash.com/photo-1571216664539-780c850fb97a?w=600&q=80", desc: "Ethnic fusion look. Perfect for traditional wear and highly durable for daily outings." }
        ];

        const products = [];
        
        // Generating 20 Premium
        for(let i=0; i<20; i++) {
            const base = basePremium[i % basePremium.length];
            products.push({
                name: `${base.name} V${i+1}`,
                type: "Premium",
                image: base.img,
                price: Math.floor(Math.random() * (1999 - 1000 + 1) + 1000),
                desc: base.desc
            });
        }
        
        // Generating 20 Casual
        for(let i=0; i<20; i++) {
            const base = baseCasual[i % baseCasual.length];
            products.push({
                name: `${base.name} Gen-${i+1}`,
                type: "Casual",
                image: base.img,
                price: Math.floor(Math.random() * (999 - 500 + 1) + 500),
                desc: base.desc
            });
        }

        // Generating 20 Slippers
        for(let i=0; i<20; i++) {
            const base = baseSlippers[i % baseSlippers.length];
            products.push({
                name: `${base.name} Edition-${i+1}`,
                type: "Slippers",
                image: base.img,
                price: Math.floor(Math.random() * (499 - 199 + 1) + 199),
                desc: base.desc
            });
        }

        // Shuffle Array
        products.sort(() => Math.random() - 0.5);

        const productGrid = document.getElementById('productGrid');
        const noResult = document.getElementById('noResult');
        let currentCategory = 'All';

        function renderProducts(searchTerm = '') {
            productGrid.innerHTML = ''; 
            let count = 0;

            products.forEach((product, index) => {
                const matchSearch = product.name.toLowerCase().includes(searchTerm.toLowerCase()) || product.desc.toLowerCase().includes(searchTerm.toLowerCase());
                const matchCat = currentCategory === 'All' || product.type === currentCategory;

                if (matchSearch && matchCat) {
                    count++;
                    const cardHTML = `
                        <div class="bg-white rounded-2xl shadow hover:shadow-xl transition-all duration-300 overflow-hidden group border border-slate-100 flex flex-col h-full transform hover:-translate-y-1">
                            <div class="relative overflow-hidden h-48 bg-gray-100">
                                <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700 ease-in-out">
                                <span class="absolute top-3 left-3 bg-white/90 text-slate-800 text-[10px] font-black px-3 py-1 rounded-full shadow uppercase tracking-wider">${product.type}</span>
                            </div>
                            <div class="p-5 flex-grow flex flex-col justify-between">
                                <div>
                                    <h3 class="font-bold text-lg text-slate-900 leading-tight mb-2">${product.name}</h3>
                                    <p class="text-xs text-slate-500 mb-4 line-clamp-3 leading-relaxed">${product.desc}</p>
                                </div>
                                <div class="border-t border-slate-100 pt-4 mt-auto">
                                    <div class="flex justify-between items-center mb-4">
                                        <p class="text-2xl font-black text-blue-600">₹${product.price}</p>
                                    </div>
                                    <button onclick="openModal(${index})" class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl hover:bg-blue-600 transition-colors shadow-md text-sm uppercase tracking-wide">
                                        Buy Now
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    productGrid.insertAdjacentHTML('beforeend', cardHTML);
                }
            });

            if(count === 0) {
                noResult.classList.remove('hidden');
            } else {
                noResult.classList.add('hidden');
            }
        }

        function filterProducts() {
            const term = document.getElementById('searchInput').value;
            renderProducts(term);
        }

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if(btn.innerText.includes(cat) || (cat==='All' && btn.innerText==='All Footwear')) {
                    btn.classList.remove('bg-gray-100', 'text-slate-700');
                    btn.classList.add('bg-slate-900', 'text-white');
                } else {
                    btn.classList.add('bg-gray-100', 'text-slate-700');
                    btn.classList.remove('bg-slate-900', 'text-white');
                }
            });
            filterProducts();
        }

        let selectedProduct = "";
        let selectedPrice = 0;

        function openModal(index) {
            const product = products[index];
            selectedProduct = product.name;
            selectedPrice = product.price;
            
            document.getElementById('modalProductName').innerText = product.name;
            document.getElementById('modalPrice').innerText = `₹${product.price}`;
            
            const modal = document.getElementById('orderModal');
            modal.classList.remove('hidden');
            document.body.classList.add('modal-active');
            
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                document.getElementById('modalContent').classList.remove('scale-95');
                document.getElementById('modalContent').classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('orderModal');
            modal.classList.add('opacity-0');
            document.getElementById('modalContent').classList.remove('scale-100');
            document.getElementById('modalContent').classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                document.body.classList.remove('modal-active');
                document.getElementById('checkoutForm').reset();
                document.getElementById('locStatus').classList.add('hidden');
            }, 300);
        }

        function autoLocate() {
            const statusText = document.getElementById('locStatus');
            const addressBox = document.getElementById('custAddress');
            
            statusText.classList.remove('hidden');
            statusText.innerText = "Requesting GPS...";
            statusText.className = "text-xs text-blue-600 mt-1 block font-bold animate-pulse";

            if (!navigator.geolocation) {
                statusText.innerText = "GPS not supported.";
                statusText.className = "text-xs text-red-500 mt-1 block font-bold";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const mapLink = `https://maps.google.com/?q=${lat},${lng}`;
                    
                    statusText.innerText = "Location mapped 📍";
                    statusText.className = "text-xs text-green-600 mt-1 block font-bold";
                    
                    addressBox.value = `📍 GPS Location:\n${mapLink}\n\n[House No.]: `;
                    addressBox.focus();
                },
                (error) => {
                    statusText.innerText = "Type manually.";
                    statusText.className = "text-xs text-red-500 mt-1 block font-bold";
                }
            );
        }

        function placeOrderViaWhatsApp() {
            const utr = document.getElementById('custUtr').value.trim();
            const name = document.getElementById('custName').value.trim();
            const address = document.getElementById('custAddress').value.trim();
            const phone = document.getElementById('custPhone').value.trim();

            if(!utr || !name || !address || !phone) {
                alert("Please complete the payment and fill all details (including UTR)!");
                return;
            }

            // YOUR WHATSAPP NUMBER
            const myWhatsAppNumber = "916260155319"; 
            
            const message = `*✅ NEW PAID ORDER ALERT ✅*\n\n*🛍️ Item:* ${selectedProduct}\n*💰 Amount Paid:* ₹${selectedPrice}\n*💳 UTR / Ref No:* ${utr}\n\n*👤 CUSTOMER INFO*\nName: ${name}\nPhone: ${phone}\n\n*📍 ADDRESS*\n${address}\n\n------------------------\n_Hi KICKS4U Team, I have made the payment. Please verify my UTR and dispatch the order._`;

            const whatsappURL = `https://wa.me/${myWhatsAppNumber}?text=${encodeURIComponent(message)}`;
            window.open(whatsappURL, '_blank');
            closeModal();
        }

        renderProducts();
    </script>
</body>
</html>
